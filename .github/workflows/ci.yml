# Compila y pasa los tests en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build M0DV0IC3.slnx -c Release

      - name: Tests
        run: dotnet test tests/M0DV0IC3.Tests -c Release --no-build
